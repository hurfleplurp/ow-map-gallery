<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overwatch Map Gallery</title>
    <meta
      name="description"
      content="A simple, elegant dark gallery for high-resolution Overwatch map images."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Playfair+Display:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-glow bg-glow-left" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-right" aria-hidden="true"></div>

    <header class="site-header">
      <p class="eyebrow">Overwatch</p>
      <h1>Map Gallery</h1>
      <p class="subtitle">High-resolution map reference library</p>
    </header>

    <main>
      <section>
        <div id="gallery" class="gallery" aria-live="polite"></div>
      </section>
    </main>

    <dialog id="lightbox" class="lightbox" aria-label="Expanded map image viewer">
      <div class="lightbox-actions">
        <div class="zoom-controls" role="group" aria-label="Image zoom controls">
          <button id="zoomOut" class="zoom-btn" type="button" aria-label="Zoom out">-</button>
          <button id="zoomReset" class="zoom-btn" type="button" aria-label="Reset zoom">100%</button>
          <button id="zoomIn" class="zoom-btn" type="button" aria-label="Zoom in">+</button>
        </div>
        <button id="closeLightbox" class="close-btn" aria-label="Close image viewer">Close</button>
      </div>
      <div id="lightboxViewport" class="lightbox-viewport">
        <img id="lightboxImage" alt="" />
      </div>
      <p id="lightboxTitle"></p>
    </dialog>

    <template id="mapCardTemplate">
      <article class="map-card">
        <button class="map-button" type="button">
          <div class="image-wrap">
            <img loading="lazy" decoding="async" />
          </div>
          <div class="map-meta">
            <h2></h2>
            <p class="map-type"></p>
          </div>
        </button>
      </article>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
